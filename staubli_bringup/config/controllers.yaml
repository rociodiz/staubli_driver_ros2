controller_manager:
  ros__parameters:
    update_rate: 250  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0

    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: false
    interpolate_from_desired_state: true

    # Al reactivar JTC tras el control manual (FVC), NO tomar el último
    # comando de posición (quedaría HOME): leer el estado medido real y
    # mantener la posición manual actual.
    set_last_command_interface_value_as_state_on_activation: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

forward_velocity_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    interface_name: velocity
